# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.go]
source = "github.com/dagger/go"

[modules.go.settings]
test = ["*", "!gotest/testdata/sample", "!cmd/otelgotest/testdata/prebuilt"]
includeExtraFiles = "./junit/testdata/sample.xml"

[modules.dagger-dang-sdk]
source = "github.com/dagger/dang-sdk"

[modules.testgen]
source = ".dagger/modules/testgen"

[sdks.dang]
module = "dagger-dang-sdk"

[sdks.dang.scopes.".dagger/modules/testgen"]
is-module = true
clients = ["github.com/dagger/go@03e734711c381da8f263cdbb670aedd2ede38822"]

[modules.golangci-lint]
source = "dagger.io/go/golangci-lint"
